<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23468a56'/><path d='M32 12l5.6 11.4L50 25.2l-9 8.8 2.1 12.4L32 40.6l-11.1 5.8L23 34l-9-8.8 12.4-1.8z' fill='white'/></svg>" />
    <title>Healthy Mind Map Events</title>
    <meta name="description" content="Engage users with a rewarding mental health experience through interactive sticker rewards, enhancing motivation and positivity during their journey." />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #ecebe8;
      }
      /* Instant paint before JS — avoids blank "loading" over slow tunnels */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ecebe8;
        color: #063235;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        z-index: 9999;
      }
      #root:not(:empty) + #boot {
        display: none;
      }
      #boot .hint {
        display: block;
        margin-top: 10px;
        max-width: 16rem;
        font-size: 12px;
        font-weight: 500;
        color: #5b6d6e;
        text-align: center;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">Your Mind Map</div>
    <script>
      // If the module graph never arrives (dead port forward), don't spin forever.
      setTimeout(function () {
        var boot = document.getElementById("boot");
        if (!boot || !document.getElementById("root") || document.getElementById("root").childElementCount) return;
        boot.innerHTML = 'Your Mind Map<span class="hint">Still waiting on the app bundle. Open the public link from chat instead of localhost.</span>';
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
